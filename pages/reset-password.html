<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งรหัสผ่านใหม่ - VehicleService Forum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <script type="importmap" src="/importmap.json"></script>
</head>
<body>
  <div id="app">
    <header id="site-header"></header>

    <main id="main-content" class="auth-page">
      <div class="container">
        <div class="auth-card">
          <div class="auth-header">
            <a href="/" class="header-brand" style="justify-content: center;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M19 17h2c.6 0 1-.4 1-1v-4c0-.6-.4-1-1-1H5c-.6 0-1 .4-1 1v4c0 .6.4 1 1 1h2"></path>
                <path d="M9 17V9.5C9 7 11 5 13.5 5S18 7 18 9.5V17"></path>
                <path d="M12 17v-5"></path>
              </svg>
              VehicleService
            </a>
            <h1>ตั้งรหัสผ่านใหม่</h1>
            <p>กรอกรหัสผ่านใหม่สำหรับบัญชีของคุณ</p>
          </div>

          <form id="reset-form" class="auth-form" novalidate>
            <div class="form-group">
              <label class="form-label" for="password">รหัสผ่านใหม่ <span class="required">*</span></label>
              <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="new-password" minlength="8">
              <span class="form-help">อย่างน้อย 8 ตัวอักษร</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="confirm_password">ยืนยันรหัสผ่านใหม่ <span class="required">*</span></label>
              <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="••••••••" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">บันทึกรหัสผ่านใหม่</button>
          </form>

          <div class="auth-footer">
            <p><a href="/pages/login.html" class="btn-link">กลับไปเข้าสู่ระบบ</a></p>
          </div>
        </div>
      </div>
    </main>

    <footer id="site-footer"></footer>
  </div>

  <script type="module">
    import { initAuth, supabase, showToast } from '/js/auth.js';

    document.addEventListener('DOMContentLoaded', async () => {
      await initAuth();

      // Load shared components
      const [headerRes, footerRes] = await Promise.all([
        fetch('/header.html'),
        fetch('/footer.html')
      ]);
      document.getElementById('site-header').innerHTML = await headerRes.text();
      document.getElementById('site-footer').innerHTML = await footerRes.text();

      const form = document.getElementById('reset-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const password = form.password.value;
        const confirmPassword = form.confirm_password.value;

        if (password !== confirmPassword) {
          showToast('รหัสผ่านไม่ตรงกัน', 'error');
          return;
        }

        if (password.length < 8) {
          showToast('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร', 'error');
          return;
        }

        const submitBtn = form.querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner spinner-sm"></span> กำลังบันทึก...';

        try {
          const { error } = await supabase.auth.updateUser({
            password: password
          });

          if (error) throw error;

          showToast('ตั้งรหัสผ่านใหม่สำเร็จ', 'success');
          setTimeout(() => window.location.href = '/pages/login.html', 2000);
        } catch (err) {
          console.error('Reset password error:', err);
          showToast(err.message || 'ไม่สามารถตั้งรหัสผ่านได้', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        }
      });
    });
  </script>
</body>
</html>
