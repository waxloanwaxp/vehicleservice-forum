<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VehicleService Forum - หาบริการยานพาหนะ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <script type="importmap" src="/importmap.json"></script>
</head>
<body>
  <div id="app">
    <!-- Header will be injected here -->
    <header id="site-header"></header>

    <main id="main-content">
      <!-- Hero Section -->
      <section class="hero">
        <div class="container">
          <h1>VehicleService Forum</h1>
          <p class="hero-tagline">หาบริการยานพาหนะ • เสนอราคา • ติดต่อโดยตรง</p>
          <div class="hero-actions">
            <a href="/pages/create-post.html" class="btn btn-primary btn-lg" id="hero-create-post">โพสต์หาบริการ</a>
            <a href="/pages/browse.html" class="btn btn-outline btn-lg">ดูบริการทั้งหมด</a>
          </div>
        </div>
      </section>

      <!-- Stats Bar -->
      <section class="stats-bar">
        <div class="container">
          <div class="stat">
            <span class="stat-value" id="stat-posts">0</span>
            <span class="stat-label">กระทู้ทั้งหมด</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-bids">0</span>
            <span class="stat-label">ราคาที่เสนอ</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-providers">0</span>
            <span class="stat-label">ผู้ให้บริการ</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-completed">0</span>
            <span class="stat-label">งานที่สำเร็จ</span>
          </div>
        </div>
      </section>

      <!-- Featured Posts -->
      <section class="featured-section">
        <div class="container">
          <div class="section-header">
            <h2>กระทู้ล่าสุด</h2>
            <a href="/pages/browse.html" class="btn btn-link">ดูทั้งหมด</a>
          </div>
          <div class="posts-grid" id="featured-posts">
            <!-- Posts will be loaded here -->
          </div>
        </div>
      </section>

      <!-- Categories -->
      <section class="categories-section">
        <div class="container">
          <h2>หมวดหมู่บริการ</h2>
          <div class="categories-grid" id="categories-grid">
            <!-- Categories will be loaded here -->
          </div>
        </div>
      </section>
    </main>

    <!-- Footer will be injected here -->
    <footer id="site-footer"></footer>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
