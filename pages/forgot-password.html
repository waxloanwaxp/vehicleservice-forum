<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลืมรหัสผ่าน - VehicleService Forum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <script type="importmap" src="/importmap.json"></script>
</head>
<body>
  <div id="app">
    <header id="site-header"></header>

    <main id="main-content" class="auth-page">
      <div class="container">
        <div class="auth-card">
          <div class="auth-header">
            <a href="/" class="header-brand" style="justify-content: center;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M19 17h2c.6 0 1-.4 1-1v-4c0-.6-.4-1-1-1H5c-.6 0-1 .4-1 1v4c0 .6.4 1 1 1h2"></path>
                <path d="M9 17V9.5C9 7 11 5 13.5 5S18 7 18 9.5V17"></path>
                <path d="M12 17v-5"></path>
              </svg>
              VehicleService
            </a>
            <h1>ลืมรหัสผ่าน</h1>
            <p>กรอกอีเมลที่ใช้สมัคร เราจะส่งลิงก์รีเซ็ตรหัสผ่านไปให้</p>
          </div>

          <form id="forgot-form" class="auth-form" novalidate>
            <div class="form-group">
              <label class="form-label" for="email">อีเมล <span class="required">*</span></label>
              <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">ส่งลิงก์รีเซ็ตรหัสผ่าน</button>
          </form>

          <div class="auth-footer">
            <p>จำรหัสผ่านได้แล้ว? <a href="/pages/login.html">เข้าสู่ระบบ</a></p>
            <p><a href="/pages/register.html" class="btn-link">สมัครสมาชิกใหม่</a></p>
          </div>
        </div>
      </div>
    </main>

    <footer id="site-footer"></footer>
  </div>

  <script type="module">
    import { initAuth, supabase, showToast } from '/js/auth.js';

    document.addEventListener('DOMContentLoaded', async () => {
      await initAuth();

      // Load shared components
      const [headerRes, footerRes] = await Promise.all([
        fetch('/header.html'),
        fetch('/footer.html')
      ]);
      document.getElementById('site-header').innerHTML = await headerRes.text();
      document.getElementById('site-footer').innerHTML = await footerRes.text();

      const form = document.getElementById('forgot-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const submitBtn = form.querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner spinner-sm"></span> กำลังส่ง...';

        try {
          const formData = new FormData(form);
          const email = formData.get('email');

          const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: `${window.location.origin}/pages/reset-password.html`
          });

          if (error) throw error;

          showToast('ส่งลิงก์รีเซ็ตรหัสผ่านไปที่อีเมลของคุณแล้ว', 'success');
          setTimeout(() => window.location.href = '/pages/login.html', 3000);
        } catch (err) {
          console.error('Forgot password error:', err);
          showToast(err.message || 'ไม่สามารถส่งลิงก์ได้ กรุณาลองใหม่', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        }
      });
    });
  </script>
</body>
</html>
